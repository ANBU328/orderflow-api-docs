name: Documentation checks

on:
  push:
  pull_request:

jobs:
  markdown-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check documentation files exist
        run: |
          test -f README.md
          test -f openapi/orderflow.yaml
          test -d docs
          echo "Documentation structure check passed."
